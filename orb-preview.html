<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>液态玻璃球 · AI 球预览</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #05070d;
        color: #dceaf7;
        font-family: system-ui, -apple-system, 'PingFang SC', sans-serif;
      }
      .page {
        max-width: 980px;
        margin: 0 auto;
        padding: 40px 24px 64px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 6px;
      }
      h2 {
        font-size: 16px;
        margin: 40px 0 16px;
        color: #9fc4e8;
      }
      .sub {
        margin: 0 0 28px;
        color: #7d93ab;
        font-size: 13px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 22px;
      }
      .row {
        display: flex;
        gap: 32px;
        flex-wrap: wrap;
      }
      .orb-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .orb-ball {
        border-radius: 50%;
      }
      .orb-label {
        font-size: 12.5px;
        color: #9fc4e8;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/components/orb/preview.ts"></script>
  </body>
</html>
