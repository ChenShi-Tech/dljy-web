#review-workbench .rw-main{padding:22px;min-height:550px}#review-workbench .rw-title{margin-bottom:18px}#review-workbench .rw-panel{background:var(--rw-paper);border:1px solid var(--rw-line);border-radius:8px;padding:18px;margin-bottom:16px;min-width:0}#review-workbench .rw-grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(235px,1fr);gap:16px}#review-workbench .rw-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-bottom:18px;background:var(--rw-paper);border:1px solid var(--rw-line);border-radius:8px}#review-workbench .rw-stat{padding:16px 18px;min-width:0}#review-workbench .rw-stat+.rw-stat{border-left:1px solid var(--rw-line)}#review-workbench .rw-value{font-size:25px;line-height:1.5;margin:4px 0;font-variant-numeric:tabular-nums}#review-workbench .rw-pill{font-size:12px;border-radius:4px;padding:2px 6px;background:var(--rw-soft);color:var(--rw-blue);display:inline-block}#review-workbench .rw-pill.warn{color:var(--rw-warn);background:light-dark(#fff4dd,#443822)}#review-workbench .rw-pill.good{color:var(--rw-green);background:light-dark(#e9f6ef,#253f37)}#review-workbench .rw-note{border-left:3px solid var(--rw-blue);padding:8px 12px;background:var(--rw-soft);margin:12px 0;color:var(--rw-ink)}#review-workbench .rw-alert{border-left-color:var(--rw-warn)}
#review-workbench .rw-event{padding:14px 0;border-bottom:1px solid var(--rw-line)}#review-workbench .rw-event:first-child{padding-top:0}#review-workbench .rw-event:last-child{border-bottom:0;padding-bottom:0}#review-workbench .rw-event button{text-align:left}#review-workbench .rw-subnav{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 18px}#review-workbench .rw-table-wrap{overflow:auto}#review-workbench table{color:var(--rw-ink);border-collapse:collapse;width:100%;font-size:13px}#review-workbench th{text-align:left;color:var(--rw-sub);font-weight:400;background:var(--rw-bg)}#review-workbench th,#review-workbench td{padding:10px;border-bottom:1px solid var(--rw-line);vertical-align:top}#review-workbench td.rw-amount,#review-workbench th.rw-amount{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}#review-workbench .rw-table-wrap table{min-width:520px}#review-workbench .rw-empty{padding:36px 20px;text-align:center;background:var(--rw-paper);border:1px solid var(--rw-line);border-radius:8px}#review-workbench .rw-empty p{max-width:520px;margin:10px auto;color:var(--rw-sub)}#review-workbench .rw-timeline{border-left:2px solid var(--rw-line);margin:15px 0 15px 8px;padding-left:20px}#review-workbench .rw-timeline article{padding-bottom:22px;position:relative}#review-workbench .rw-timeline article:before{content:"";position:absolute;left:-26px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--rw-blue)}#review-workbench .rw-timeline article:last-child{padding-bottom:0}#review-workbench .rw-fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}#review-workbench .rw-wide{grid-column:1/-1}#review-workbench .rw-check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--rw-ink);margin:12px 0}#review-workbench .rw-check input{width:auto;margin:0}#review-workbench .rw-footer{border-top:1px solid var(--rw-line);padding:9px 20px;font-size:12px;color:var(--rw-sub);display:flex;justify-content:space-between;flex-wrap:wra <script>
(()=>{
const root=document.getElementById('review-workbench');
// Maintained design fixture. All money below is synthetic, never a settlement result.
const state={page:'overview',analysis:'经营结果',archive:'待办与改进',subject:'售电',region:'山西',period:'日度',mode:'正常',density:'标准',detail:null,notice:'',blind:true,step:0,template:null,search:'',group:'全部',actionStage:0,submitted:false,learning:false,point:72,showAll:false};
const initialMode={empty:'无数据',error:'读取失败',denied:'无权限',revised:'资料更新'}[new URLSearchParams(location.search).get('state')];
if(initialMode)state.mode=initialMode;
state.date='2026-09-07';state.form={};state.appearance=new URLSearchParams(location.search).get('theme')==='dark'?'深色':'跟随系统';
const formKey=id=>[state.detail||state.page,state.detail==='template'?state.template:'',id].join('|');
const pages={overview:'复盘总览',analysis:'交易分析',settlement:'结算核对',replay:'决策回放',archive:'复盘档案'};
const groups={通用:['决策复盘单','月度收益拆解报告','典型交易分析表','策略胜率分析报告','执行偏差分析表','月度市场归因报告','偏差归因分析报告','偏差成本核算表','月度风险事件报告','极端情景压力测试报告','情绪化决策分析报告','复盘会议纪要','复盘案例库登记表'],储能:['峰谷套利复盘表','辅助服务收益复盘表','充放电计划执行偏差复盘表','储能容量利用率与荷电状态复盘表','储能投资决策复盘单'],售电:['代理购电偏差复盘表','零售套餐履约复盘表','用户用电结构与售电收益拆解表','售电偏差考核成本核算表','售电侧月度综合复盘报告'],新能源:['出力预测准确率复盘表','新能源偏差考核复盘表','弃电率复盘表','中长期签约策略复盘表','功率预测模型评估表'],时段工具:['24时段充放电策略编排表','24时段充放电执行与偏差复盘表','24时段电价与套利复盘表']};
const rows=Array.from({length:96},(_,i)=>({i,time:String(Math.floor(i/4)).padStart(2,'0')+':'+String(i%4*15).padStart(2,'0'),actual:10,cleared:8,baseline:9,da:300,rt:i>=72&&i<=74?800:300}));
const money=n=>n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const cost=r=>r.cleared*r.da+(r.actual-r.cleared)*r.rt;
const value=r=>(r.baseline*r.da+(r.actual-r.baseline)*r.rt)-cost(r);
const total=rows.reduce((s,r)=>s+cost(r),0),gain=rows.reduce((s,r)=>s+value(r),0);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(label,action,cls='',extra='')=>`<button type="button" class="${cls}" data-action="${action}" ${extra}>${label}</button>`;
const pill=(label,kind='')=>`<span class="rw-pill ${kind}">${label}</span>`;
const opts=(list,current)=>list.map(v=>`<option ${v===current?'selected':''}>${v}</option>`).join('');
const title=(name,sub,actions='')=>`<div class="rw-title rw-row rw-between"><div><h1>${name}</h1><small>${sub}</small></div><div class="rw-row">${actions}</div></div>`;
const panel=(heading,body)=>`<section class="rw-panel"><h2>${heading}</h2>${body}</section>`;
const note=text=>`<div class="rw-note">${text}</div>`;
const empty=(heading,body,action='')=>`<section class="rw-empty"><h2>${heading}</h2><p>${body}</p>${action}</section>`;
const stat=(label,val,sub)=>`<div class="rw-stat"><span>${label}</span><div class="rw-value">${val}</div><small>${sub}</small></div>`;
const evidence=()=>`<details class="rw-evidence"><summary>查看计算口径与资料</summary><p>本设计稿使用虚构电量、电价和回执。金额为演示测算；购电成本不包含零售收入、中长期合约差额、考核及分摊费用。</p><p>资料：示例出清回执、示例计量记录、示例电价披露。计算时间：9 月 8 日 08:30；资料截止：08:20。事前基准在 9 月 6 日 09:00 留存。</p><p>正式产品在此展示资料名称、业务日期、发布时间、修订时间和计算口径，可逐项打开原始凭证；不展示技术存储名称。</p></details>`;
function subnav(values,current,key){return `<div class="rw-subnav" aria-label="${key==='analysis'?'分析内容':'档案分类'}">${values.map(v=>button(v,`${key}:${v}`,v===current?'rw-selected':'',`aria-pressed="${v===current}"`)).join('')}</div>`;}
function hourBars(){return `<div class="rw-row rw-between"><small>每小时购电成本相对基准的增加额（元）</small>${pill('18 时 · 增加 1,500 元','warn')}</div><div class="rw-bars">${Array.from({length:24},(_,h)=>button(`<span aria-hidden="true" style="position:absolute;bottom:0;left:0;right:0;height:${h===18?86:0}px;background:var(--rw-red);border-radius:3px 3px 0 0"></span>`,`hour:${h}`,'',`style="height:92px;background:transparent;position:relative;opacity:1" aria-label="${h} 时，成本增加 ${h===18?1500:0} 元，查看时段"`)).join('')}</div><div class="rw-axis"><span>00 时</span><span>06 时</span><span>12 时</span><span>18 时</span><span>23 时</span></div>`;}
function overview(){return title('先处理影响最大的事项','9 月 7 日复盘 · 金额均为演示测算',button('准备晨会','meeting','rw-primary'))+`<div class="rw-stats">${stat('当日现货购电成本','29.10 万元','尚未与正式账单核对')}${stat('相对事前基准','−1,500 元','购电成本增加，经营利润待补齐')}${stat('需要处理','3 项','1 项资料缺失 · 1 项临近截止')}</div><div class="rw-grid"><div>${panel('待处理事项',`<article class="rw-event"><div class="rw-row rw-between"><strong>晚高峰采购不足，成本增加</strong>${pill('今天 10:00 前','warn')}</div><p class="rw-muted">18:00–18:45 · 3 个时段 · 相对基准增加 1,500 元</p><div class="rw-row">${button('查看时段','event:cost','rw-primary')}${button('回看当时判断','nav:replay','rw-text')}</div></article><article class="rw-event"><div class="rw-row rw-between"><strong>次日申报缺少出清回执</strong>${pill('等待资料','warn')}</div><p class="rw-muted">9 月 8 日 · 暂不能判断申报是否成交</p>${button('查看缺口与处理人','event:missing','rw-text')}</article><article class="rw-event"><div class="rw-row rw-between"><strong>8 月账单仍有 120 元差异</strong>${pill('待核对')}</div><p class="rw-muted">月度分摊费用 · 未计入日度复盘</p>${button('进入结算核对','nav:settlement','rw-text')}</article>`)}${panel('影响集中在哪些时段',hourBars()+`<div class="rw-row rw-between"><small>按真实结算时段计算，小时仅作展示聚合。</small>${button('打开全部时段','nav:analysis','rw-text')}</div>`)}</div><aside>${panel('资料与口径',`<div class="rw-event"><div class="rw-row rw-between"><span>电价与计量</span>${pill('96 / 96 时段','good')}</div></div><div class="rw-event"><div class="rw-row rw-between"><span>当日出清回执</span>${pill('已齐备','good')}</div></div><div class="rw-event"><div class="rw-row rw-between"><span>零售收入与合约</span>${pill('尚未接入','warn')}</div></div><p class="rw-muted">当前可以分析采购成本，暂不能计算经营利润。</p>${button('查看资料清单','event:readiness','rw-text')}`)}${panel('改进回查',`<strong>晚高峰采购检查</strong><p class="rw-muted">已执行 4 天，尚未达到验证窗口。</p><div class="rw-steps"><span>待落实</span><span class="active">验证中</span><span>已验证</span></div>${button('查看验证标准','action:existing','rw-text')}`)}${panel('晨会准备',`<p>聚焦 3 件事：异常时段、资料缺口、昨日改进。</p><small>目标：5 分钟内完成。结论由交易员确认。</small>`)}</aside></div>`;}
function intervalTable(){const selected=state.showAll?rows:rows.slice(72,76);return `<div class="rw-row rw-between"><h2>结算时段明细</h2><div class="rw-row">${button(state.showAll?'只看晚高峰':'查看全部 96 时段','all')}${button('导出明细','export:intervals')}</div></div><div class="rw-table-wrap"><table><thead><tr><th>起始时刻</th><th class="rw-amount">实际用电量<br>兆瓦时</th><th class="rw-amount">日前出清量<br>兆瓦时</th><th class="rw-amount">实时电价<br>元 / 兆瓦时</th><th class="rw-amount">购电成本<br>元</th><th class="rw-amount">相对基准增益<br>元</th><th>操作</th></tr></thead><tbody>${selected.map(r=>`<tr><td>${r.time}</td><td class="rw-amount">${r.actual.toFixed(2)}</td><td class="rw-amount">${r.cleared.toFixed(2)}</td><td class="rw-amount">${r.rt.toFixed(2)}</td><td class="rw-amount">${money(cost(r))}</td><td class="rw-amount ${value(r)<0?'rw-red':''}">${money(value(r))}</td><td>${button('分析',`point:${r.i}`,'rw-text',`aria-label="分析 ${r.time} 时段"`)}</td></tr>`).join('')}</tbody></table></div>`;}

function replay(){const steps=['09:00 方案留存','09:35 人工调整','09:48 提交回执'];const info=[['事前采购基准','每个时段采购 9 兆瓦时；目标为控制晚高峰暴露。预测、持仓、限额与资料一并留存。'],['交易员调整为 8 兆瓦时','当时预期实时电价较低，希望留出实时采购空间。保留人工理由，不能用事后电价覆盖。'],['交易平台已接收','只证明已接收申报。当时尚未取得出清结果，不能据此认定成交。']][state.step];return title('把判断放回当时','9 月 6 日决策 · 对应 9 月 7 日交付',button(state.blind?'查看事后结果':'返回当时视角','blind',state.blind?'':'rw-primary'))+note(state.blind?'当时视角：仅显示在所选时刻已经收到的资料。事后电价、盈亏和结果提示均已隐藏。':'事后视角：用于核对结果；这些信息不参与对当时决策的公平评价。')+`<div class="rw-subnav">${steps.map((s,i)=>button(s,`step:${i}`,state.step===i?'rw-selected':'',`aria-pressed="${state.step===i}"`)).join('')}</div><div class="rw-grid"><div>${panel(info[0],`<p>${info[1]}</p><div class="rw-timeline"><article><small>已知资料</small><p>日前电价预测、负荷预测、持仓和风险限额</p></article><article><small>可选择动作</small><p>在限额内调整日前采购量；按时提交并检查平台回执</p></article><article><small>当时的不确定性</small><p>实时电价、实际用电量、最终出清结果尚不可知</p></article></div>${button('查看当时资料','event:snapshot','rw-text')}`)}${!state.blind?panel('事后结果',`<p>18:00–18:15：实际用电量 10 兆瓦时，日前出清量 8 兆瓦时，实时电价 800 元 / 兆瓦时。</p><p class="rw-red">该时段相对事前基准增益 −500 元。</p>${button('试算另一个动作','counterfactual')}`):''}</div><aside>${panel('人工判断',`<label>当时的判断是否合理？<textarea id="rw-judgment" placeholder="请依据当时已知资料填写"></textarea></label><label style="margin-top:12px">下一次准备如何改进？<textarea id="rw-improvement" placeholder="写明具体动作和适用条件"></textarea></label><div class="rw-row" style="margin-top:12px">${button('保存判断草稿','save:judgment','rw-primary')}</div><small>仅保存在本次预览中。正式产品由本人提交并留存更正记录。</small>`)}</aside></div>`;}
function actionContent(existing=false){return `<div class="rw-steps"><span ${state.actionStage===0?'class="active"':''}>待落实</span><span ${state.actionStage===1?'class="active"':''}>验证中</span><span ${state.actionStage===2?'class="active"':''}>已验证</span></div><div class="rw-fields"><label class="rw-wide">具体改进动作<input id="rw-action-title" value="${existing?'晚高峰采购检查':''}" placeholder="例如：提交前复核晚高峰未覆盖电量"></label><label>处理人<input id="rw-owner" value="${existing?'当班交易员':''}" placeholder="请选择或填写处理人"></label><label>落实期限<input id="rw-due" type="date" value="2026-09-10"></label><label class="rw-wide">适用条件<textarea id="rw-applicability" placeholder="在什么主体、行情和约束下采用">${existing?'晚高峰暴露较高且日前采购仍可调整时':''}</textarea></label><label class="rw-wide">如何验证有效<textarea id="rw-success" placeholder="比较基准、观察窗口、成功标准、何时撤回">${existing?'观察至少 20 个交易日，并检查行情覆盖；对比事前基准的增益与尾部损失。风险越限立即撤回；资料不足则延长验证，不自动宣布有效。':''}</textarea></label></div>${button(existing?'记录本次回查':'保存改进草稿','save:action','rw-primary')} ${existing?button('标记已落实，开始验证','implemented'):''}<p><small>“已落实”表示动作已执行。“已验证”需要验证结论与证据，不能一键代替。</small></p>`;}

if(state.archive==='报告与模板'){const all=Object.entries(groups).flatMap(([g,names])=>names.map(n=>({g,n})));const list=all.filter(t=>(state.group==='全部'||t.g===state.group)&&t.n.includes(state.search));content=(state.subject==='售电'&&state.region==='山西'&&state.date==='2026-09-07'&&state.period==='日度'?panel('报告库',`<div class="rw-row rw-between"><div><strong>9 月 7 日交易复盘日报</strong><p class="rw-muted">演示草稿 · 待交易员确认</p></div>${button('阅读报告','report')}</div>`):empty('当前范围暂无演示报告','可先查看模板结构与资料要求。'))+panel('模板目录',`<div class="rw-fields"><label>查找模板<input id="rw-search" placeholder="按业务名称查找" value="${esc(state.search)}"></label><label>业务分类<select id="rw-group">${opts(['全部',...Object.keys(groups)],state.group)}</select></label></div><p class="rw-muted">共 31 类模板 · 当前显示 ${list.length} 类。缺少资料时可查看结构和补齐清单。</p><div class="rw-library">${list.map(t=>`<article class="rw-template"><div>${button(esc(t.n),`template:${t.n}`)}<small>${t.g} · ${['储能','新能源','时段工具'].includes(t.g)?'等待业务资料':'可预览填写结构'}</small></div>${pill(['储能','新能源','时段工具'].includes(t.g)?'待补资料':'预览', ['储能','新能源','时段工具'].includes(t.g)?'warn':'')}</article>`).join('')||'<p>没有匹配的模板，请调整关键词。</p>'}</div>`);}
if(state.archive==='案例与会议')content=`<div class="rw-grid">${panel('案例库',`<strong>晚高峰采购量调整</strong><p class="rw-muted">适用：售电 · 高价风险 · 仅内部可见</p><p>保留当时资料、实际结果和改进验证，避免只留下成功故事。</p>${button('阅读案例','case')}${button('登记新案例','template:复盘案例库登记表','rw-text')}`)}${panel('复盘会议',`<strong>9 月 8 日晨会</strong><p class="rw-muted">待确认事项、上期未落实措施自动带入。</p>${button('准备会议纪要','template:复盘会议纪要','rw-primary')}${button('查看未落实项','archive:待办与改进','rw-text')}`)}</div>`;
if(state.archive==='学习记录')content=panel('个人学习记录',`<p>用于个人学习辅导，不用于交易员排名或绩效评价。</p><label class="rw-check"><input id="rw-learning" type="checkbox" ${state.learning?'checked':''}>启用情绪与决策记录</label>${state.learning?`<p>当前没有足够的人工记录，暂不显示模式结论。</p>${button('填写学习记录','template:情绪化决策分析报告')}`:'<p class="rw-muted">当前已关闭。不开启采集、提示或推断。</p>'}`);
return title('把复盘变成可追踪的改进','待办、报告、案例与验证记录集中管理')+subnav(['待办与改进','报告与模板','案例与会议','学习记录'],state.archive,'archive')+content;}
function subjectEmpty(){const renewable=state.subject==='新能源';const needs=renewable?'场站实发电量、预测留存版本、可用出力与限电记录':'充放电实绩、剩余电量轨迹、可用容量、辅助服务结算';const fees=renewable?['现货上网收入','中长期合约差额','机制电量结算（适用时）','偏差考核与费用调整']:['放电收入','充电购电成本','辅助服务收入','运行与损耗成本'];const names=renewable?['出力预测','偏差考核','弃电分析','中长期合约']:['峰谷套利','执行偏差','容量与剩余电量','辅助服务'];const templates=renewable?['出力预测准确率复盘表','新能源偏差考核复盘表','弃电率复盘表','中长期签约策略复盘表']:['峰谷套利复盘表','充放电计划执行偏差复盘表','储能容量利用率与荷电状态复盘表','辅助服务收益复盘表'];if(state.page==='replay')return title(`${state.subject}决策回放`,`${state.region} · 当时资料与动作`)+empty('尚未留存完整的当时资料',renewable?'需留存出力预测、合约持仓、可交易电量与人工调整后，才能回放当时判断。':'需留存当时剩余电量、可用容量、充放电计划、电价预测和运行约束。',button('查看资料清单','event:readiness'));const feePanel=panel(renewable?'上网收入与结算调整':'储能收益与成本',`<table><thead><tr><th>业务项目</th><th>金额</th><th>状态</th></tr></thead><tbody>${fees.map(f=>`<tr><td>${f}</td><td>待计算</td><td>需业务资料</td></tr>`).join('')}</tbody></table><p class="rw-muted">每项保留单独来源与结算口径，未齐备前不合成为经营利润。</p>`);if(state.page==='settlement')return title(`${state.subject}结算核对`,`${state.region} · 按主体费用项目核对`)+feePanel+empty('还没有可核对的账单','补齐同公司、地区、资产和账期的账单及业务实绩后，逐项核对差异。',button('查看所需资料','event:readiness'));return title(`${state.subject}交易复盘`,`${state.region} · 按当前主体单独核验资料`)+`<div class="rw-stats">${stat(renewable?'上网结算收入':'运行净收益','待计算','缺少收入与结算资料')}${stat(renewable?'出力预测偏差':'计划执行偏差','待计算','需预测或计划与实绩对齐')}${stat(renewable?'限电与弃电':'可用容量与剩余电量','待补齐','需物理运行记录')}</div><div class="rw-grid"><div>${panel(renewable?'预测、实发与受限出力':'充放电计划、实绩与剩余电量',`<p class="rw-muted">${renewable?'主图按结算时段对齐预测与实发，可用出力与受限区间单独显示。':'主图对齐计划与实际充放电，剩余电量曲线保留上下限；不可行时段单独标记。'}</p><div class="rw-empty"><strong>时序资料尚未接入</strong><p>${needs}</p>${button('查看补齐清单','event:readiness')}</div>`)}${feePanel}</div><aside>${panel('专项复盘',names.map((n,i)=>`<article class="rw-event"><strong>${n}</strong><p class="rw-muted">等待对应业务资料</p>${button('预览'+n+'模板',`template:${templates[i]}`,'rw-text')}</article>`).join(''))}${panel('资料与范围',`<p>当前只保留本主体的结构和业务入口。</p>${button('查看全部主体模板',`subject-templates:${state.subject}`,'rw-text')}`)}</aside></div>`;}

function render(){root.style.colorScheme=state.appearance==='深色'?'dark':state.appearance==='浅色'?'light':'light dark';root.style.setProperty('--rw-density',state.density);root.innerHTML=`<header class="rw-chrome"><div class="rw-row"><span class="rw-brand">Ω 电力交易工作台</span><span class="rw-muted">/ 交易复盘</span><span class="rw-demo">模拟数据 · 交互设计稿</span></div><div class="rw-row rw-scope"><label>业务范围<select id="rw-subject">${opts(['售电','新能源','储能'],state.subject)}</select></label><label>市场地区<select id="rw-region">${opts(['山西','云南'],state.region)}</select></label><label>复盘周期<select id="rw-period">${opts(['日度','周度','月度','季度'],state.period)}</select></label><label>业务日期<input id="rw-date" type="date" value="${state.date}"></label><div><small>当前公司</small><p>示例电力公司</p></div></div></header><nav class="rw-nav" aria-label="复盘导航">${Object.entries(pages).map(([key,name])=>button(name,`nav:${key}`,'',state.page===key?'aria-current="page"':'')).join('')}</nav>${state.mode!=='正常'?`<div class="rw-banner">设计状态预览：${state.mode}</div>`:''}<main class="rw-main">${state.notice?`<div class="rw-status" role="status">${esc(state.notice)}</div>`:''}${content()}<div id="rw-detail">${state.detail?detail():''}</div></main><footer class="rw-footer"><span>模拟资料 · 演示测算 · 不可作为结算依据</span><span>草稿仅存于本次预览，刷新后清除</span></footer>`;root.style.setProperty('line-height',state.density==='紧凑'?'1.4':'1.55');drawPrices();root.querySelectorAll('input,textarea').forEach(el=>{const v=state.form[formKey(el.id)];if(v!==undefined)el.value=v;});}
function content(){if(state.mode==='读取失败')return empty('资料读取失败','尚未取得本次计算结果。请重试；此前结果不能代表本次复盘。',button('重试','retry','rw-primary'));if(state.mode==='无权限')return empty('当前账号无权查看此业务范围','请由公司管理员核实岗位权限。此页面不展示相关金额或资料。');if(state.mode==='无数据')return empty('所选日期尚无复盘资料','先补齐电价、计量与出清回执，即可开始结果复盘。',button('查看资料清单','event:readiness'));if(state.mode==='资料更新')return note('08:45 收到修订资料。当前仍显示 08:30 的完整计算结果，重算后统一切换。')+button('按新资料重新计算','recompute','rw-primary')+overview();if(state.page==='archive'){if((state.subject!=='售电'||state.region!=='山西'||state.date!=='2026-09-07'||state.period!=='日度')&&state.archive!=='报告与模板')return title('复盘档案',`${state.region} · ${state.subject} · 当前范围`)+subnav(['待办与改进','报告与模板','案例与会议','学习记录'],state.archive,'archive')+empty('当前范围尚无演示记录','可以查看本业务模板与所需资料。其他范围的记录不会带入。',button('查看模板','archive:报告与模板','rw-primary'));return archive();}if(state.date!=='2026-09-07')return title('所选日期交易复盘',state.date)+empty('这一天尚无演示资料','当前设计稿提供 9 月 7 日完整示例，正式系统将按所选业务日期取数。',button('回到示例日期','sample-date','rw-primary'));if(state.subject!=='售电')return subjectEmpty();if(state.region!=='山西')return title('云南交易复盘','当前地区尚未准备可用的演示资料')+empty('请先核实云南结算口径与主体资料','按当地有效规则计算，保留三段式结果和场站明细；不会借用山西数据或规则。',button('查看地区资料清单','event:readiness'));if(state.period!=='日度'&&state.page!=='settlement')return title(`${state.period}交易复盘`,'示例仅提供一个完整交易日，不能代替整期数据')+empty('整期资料尚未齐备','日度可分析范围与月度独有费用分别列示。周、月、季度保留结果、市场、偏差和风险分析入口。',button('查看汇总口径','event:period')+' '+button('回到日度示例','daily','rw-primary'));return ({overview,analysis,settlement,replay})[state.page]();}
function detail(){let heading='',body='';let d=state.detail;
if(d==='point'){const r=rows[state.point];heading=`${r.time} 起始时段 · 15 分钟`;body=`<table class="rw-detail-table"><tbody><tr><th>日前申报量 / 出清量</th><td>8.00 / 8.00 兆瓦时</td></tr><tr><th>实际用电量</th><td>10.00 兆瓦时</td></tr><tr><th>事前基准采购量</th><td>9.00 兆瓦时</td></tr><tr><th>日前 / 实时电价</th><td>300.00 / ${r.rt.toFixed(2)} 元 / 兆瓦时</td></tr><tr><th>实际方案购电成本</th><td>${money(cost(r))} 元</td></tr><tr><th>基准方案购电成本</th><td>${money(cost(r)+value(r))} 元</td></tr><tr><th>相对基准增益</th><td>${money(value(r))} 元</td></tr></tbody></table>${note('上述差额是会计比较结果。为什么这样决策、谁承担责任，需要结合当时资料另行判断。')}<div class="rw-row">${button('回看当时判断','nav:replay','rw-primary')}${button('建立改进措施','action:new')}${button('查看计算依据','event:baseline')}</div>${evidence()}`;}
else if(d==='template'){heading=state.template;const special=/充放电|24时段|出力预测|套利|荷电/.test(state.template);body=`${pill(state.submitted?'已提交 · 演示':'草稿 · 演示')}<p class="rw-muted">事实资料只读，判断内容由本人填写。提交后更正须追加记录。</p>${special?note('相关业务资料尚未齐备。下方展示时段表的布局，暂不填入示例经营金额。')+`<div class="rw-table-wrap"><table><thead><tr><th>小时</th><th>计划电量<br>兆瓦时</th><th>实际电量<br>兆瓦时</th><th>偏差<br>兆瓦时</th><th>说明</th></tr></thead><tbody>${['00:00–01:00','01:00–02:00','…','23:00–24:00'].map(t=>`<tr><td>${t}</td><td>待补充</td><td>待补充</td><td>待计算</td><td>需对应结算时段资料</td></tr>`).join('')}</tbody></table></div>`:`<div class="rw-note">${state.subject==='售电'&&state.region==='山西'?'关联事实：9 月 7 日晚高峰采购量调整；来源为本设计稿模拟资料。':'当前业务资料尚未齐备，仅预览表单结构。'}</div>`}<div class="rw-fields"><label class="rw-wide">判断依据<textarea id="rw-reason" ${state.submitted?'disabled':''} placeholder="描述当时依据，不由系统代填">${esc(state.reason||'')}</textarea></label><label class="rw-wide">复盘结论<textarea id="rw-conclusion" ${state.submitted?'disabled':''} placeholder="说明哪些判断成立、哪些需要修正">${esc(state.conclusion||'')}</textarea></label><label class="rw-wide">改进措施<textarea id="rw-measure" ${state.submitted?'disabled':''} placeholder="写明下一步动作、处理人和验证方式">${esc(state.measure||'')}</textarea></label></div><div class="rw-row">${state.submitted?button('追加更正','correct'):button('保存草稿','save:template')+' '+button('提交复盘单','submit','rw-primary')}</div>`;}
else if(d==='action'){heading='改进措施与验证';body=actionContent(state.existingAction);}
else if(d==='reconcile'){heading='月度分摊费用 · 差异 120 元';body=`<p>账单 2,120 元，测算 2,000 元。当前差异尚未解释。</p><div class="rw-fields"><label class="rw-wide">补充凭证名称<input id="rw-voucher" placeholder="填写分摊通知或账单说明的名称"></label><label class="rw-wide">核对说明<textarea id="rw-reconcile" placeholder="说明差异原因及后续处理"></textarea></label></div>${button('保存核对记录','save:reconcile','rw-primary')}<p><small>本预览只演示记录过程，不上传凭证、不修改账单金额、不消除差异。</small></p>`;}
else if(d==='missing'||d==='readiness'){heading=d==='missing'?'出清回执待补齐':'资料就绪情况';const renewable=state.subject==='新能源',storage=state.subject==='储能';body=`<table><thead><tr><th>业务资料</th><th>当前情况</th><th>处理岗位</th></tr></thead><tbody>${(renewable?[['实发与预测留存','待接入','场站运营'],['限电与可用出力','待接入','场站运营']]:storage?[['充放电与剩余电量','待接入','储能运营'],['辅助服务账单','待接入','结算岗']]:[['9 月 7 日电价与计量','96 个时段齐全','数据管理员'],['9 月 8 日出清回执','尚未收到','数据管理员'],['零售收入与合约','尚未接入','结算岗']]).map(a=>`<tr>${a.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table><p class="rw-muted">缺少出清回执时，可看申报记录，暂不能计算成交率与执行增益；缺少收入时仅显示已具备条件的成本分析。</p>${button('建立资料补齐待办','data-todo','rw-primary')}`;}
else if(d==='baseline'){heading='事前基准与比较边界';body=`<p>9 月 6 日 09:00 留存基准：每时段日前采购 9 兆瓦时。实际方案：每时段日前出清 8 兆瓦时。</p><p>本演示采用价格接受者假设，以同一实际量和价格结算两个采购方案；不代表更改申报后一定按相同电价成交。</p><p>正式产品须保存当时持仓、交易限额、出清可行性和规则版本。缺少这些资料时，只提供情景测算，不给策略优劣结论。</p>${evidence()}`;}
else if(d==='snapshot'){heading='所选时刻已收到的资料';body=`<table><thead><tr><th>资料</th><th>收到时间</th><th>适用日期</th></tr></thead><tbody><tr><td>负荷预测留存稿</td><td>9 月 6 日 08:35</td><td>9 月 7 日</td></tr><tr><td>日前电价预测留存稿</td><td>9 月 6 日 08:40</td><td>9 月 7 日</td></tr><tr><td>持仓与风险限额</td><td>9 月 6 日 08:55</td><td>本次决策</td></tr></tbody></table><p class="rw-muted">正式产品展示当时收到的版本。事后补录资料须标为“事后补录”，不能用于公平评价当时决策。</p>`;}
else if(d==='counterfactual'){heading='试算另一个动作';body=`${note('情景测算 · 不代表一定能够成交，也不构成实际交易指令。')}<label>18:00 时段日前采购量（兆瓦时）<input id="rw-alt" type="number" min="0" max="10" step="0.5" value="9"></label><p>固定演示价格：日前 300、实时 800 元 / 兆瓦时；实际用电量 10 兆瓦时。</p>${button('计算对比','simulate','rw-primary')}<div id="rw-alt-result" aria-live="polite"></div>`;}
else if(d==='period'){heading='周、月、季度如何汇总';body=`<p>先汇总同一口径的逐日现货电费，再单列本期独有的考核、分摊与调整项目。</p><table><tbody><tr><th>日度现货电费</th><td>按结算时段精确汇总</td></tr><tr><th>月度考核与分摊</th><td>保留月度归属，单独核对</td></tr><tr><th>完整性</th><td>列明应有交易日、已到资料和未计算范围</td></tr><tr><th>同比与环比</th><td>仅在范围、规则与数据覆盖可比时展示</td></tr></tbody></table>`;}
else if(d==='market'){heading='市场资料与归因证据';body=`<p>本例只有电价数据，尚缺供需、气象、检修和约束披露资料。</p><p>正式页面按业务名称展示资料及其发布时间，允许从价格异常跳到同一时段的披露记录；没有证据的解释必须保留“待核实”。</p>${button('登记待核实判断','template:月度市场归因报告')}`;}
else if(d==='risk'){heading='申报提交险些超时';body=`${pill('险情 · 未形成损失','warn')}<p>9 月 6 日 09:48，申报被平台接收，接近内部检查时限。</p><p>实际损失：0 元。潜在影响：尚未量化，不能混入已发生损失。</p>${button('制定检查改进','action:new','rw-primary')}${button('登记风险案例','template:复盘案例库登记表','rw-text')}`;}
else if(d==='report'){heading='9 月 7 日交易复盘日报';body=`${pill('演示草稿')}<h3 style="margin-top:16px">事实摘要</h3><p>现货购电成本 291,000 元；相对事前基准增益 −1,500 元，影响集中于晚高峰 3 个时段。零售收入及合约等资料尚未齐备，不能形成经营利润结论。</p><h3>待确认事项</h3><p>当时减少日前采购的判断是否合理，需要交易员结合留存资料填写。</p><h3>改进回查</h3><p>晚高峰采购检查已执行 4 天，验证窗口尚未结束。</p>${button('填写人工结论','template:决策复盘单','rw-primary')}${evidence()}`;}
else if(d==='case'){heading='案例：晚高峰采购量调整';body=`<p>适用范围：售电业务；实时高价风险；价格接受者情景。</p><h3>事实与当时判断</h3><p>相对基准减少日前采购，实际遇到实时高价。不能仅凭结果倒推当时判断错误。</p><h3>改进及验证</h3><p>增加提交前暴露检查，验证仍在进行中。</p><div class="rw-row">${button('进入决策回放','nav:replay','rw-primary')}${button('查看验证记录','action:existing')}</div>`;}
else if(d==='import'){heading='导入并核对账单';body=`<div class="rw-steps"><span class="active">选取账单</span><span>检查范围</span><span>预览匹配</span><span>确认导入</span></div><p>正式产品支持账单文件和费用项目映射，导入前检查公司、地区、月份、币种、含税口径及重复版本。</p>${note('本设计稿不读取本机账单。下一步使用内置示例演示导入预览。')}${button('预览内置示例账单','import-preview','rw-primary')}`;}
else if(d==='import-preview'){heading='导入预览 · 示例账单';body=`<p>示例电力公司 · 山西 · 2026 年 8 月</p><p>3 项费用，共 512,120 元；2 项已匹配，月度分摊仍有 120 元差异。</p><p class="rw-muted">存在同月示例版本，正式导入应保留旧版并新增修订版。</p>${button('确认示例导入','import-confirm','rw-primary')}`;}
else if(d==='meeting'){heading='晨会复盘提纲';body=`<div class="rw-timeline"><article><strong>1 分钟 · 资料与结果</strong><p>确认资料范围与哪些数字暂不能算。</p></article><article><strong>2 分钟 · 重点交易</strong><p>定位晚高峰 3 个时段，查看当时判断。</p></article><article><strong>1 分钟 · 回查</strong><p>检查昨日改进是否执行，验证是否到期。</p></article><article><strong>1 分钟 · 分工</strong><p>确定每个待办的处理人和截止时间。</p></article></div>${button('开始填写纪要','template:复盘会议纪要','rw-primary')}`;}
return `<section class="rw-drawer" aria-label="${heading}"><div class="rw-row rw-between"><h2>${heading}</h2>${button('关闭详情','close')}</div>${body}</section>`;}
function openDetail(d){state.detail=d;render();root.querySelector('#rw-detail').scrollIntoView({behavior:'smooth',block:'nearest'});root.querySelector('#rw-detail button')?.focus({preventScroll:true});}
function read(id){return root.querySelector('#'+id)?.value.trim()||'';}
function saveTemplate(){state.reason=read('rw-reason');state.conclusion=read('rw-conclusion');state.measure=read('rw-measure');}
function feedback(s){state.notice=s;render();}
root.addEventListener('change',e=>{const id=e.target.id;if(id==='rw-date'){state.date=e.target.value;state.detail=null;state.notice='';render();}else if(id==='rw-subject'||id==='rw-region'||id==='rw-period'){state[id==='rw-subject'?'subject':id==='rw-region'?'region':'period']=e.target.value;state.detail=null;state.notice='';render();}else if(id==='rw-group'){state.group=e.target.value;render();}else if(id==='rw-learning'){state.learning=e.target.checked;render();}});
root.addEventListener('input',e=>{if(e.target.id!=='rw-search'&&e.target.id!=='rw-date'&&e.target.type!=='checkbox'){state.form[formKey(e.target.id)]=e.target.value;}if(e.target.id==='rw-search'){const p=e.target.selectionStart;state.search=e.target.value;render();const x=root.querySelector('#rw-search');x.focus();x.setSelectionRange(p,p);}});
root.addEventListener('click',e=>{const el=e.target.closest('button[data-action]');if(!el)return;const [a,...rest]=el.dataset.action.split(':');const v=rest.join(':');state.notice='';
if(a==='nav'){state.page=v;state.detail=null;render();}
else if(a==='analysis'||a==='archive'){state.page=a;state[a]=v;state.detail=null;render();}
else if(a==='event'){if(v==='cost'){state.point=72;openDetail('point');}else openDetail(v);}
else if(a==='point'||a==='hour'){state.point=a==='hour'?Number(v)*4:Number(v);openDetail('point');}
else if(a==='all'){state.showAll=!state.showAll;render();}
else if(a==='close'){state.detail=null;render();}
else if(a==='blind'){state.blind=!state.blind;state.detail=null;render();}
else if(a==='step'){state.step=Number(v);state.detail=null;render();}
else if(a==='template'){state.template=v;state.submitted=false;state.reason='';state.conclusion='';state.measure='';openDetail('template');}
else if(a==='action'){state.existingAction=v==='existing';state.actionStage=state.existingAction?1:0;openDetail('action');}
else if(a==='save'){if(v==='template'){saveTemplate();feedback('复盘草稿已保存在本次预览中。');}else if(v==='judgment'){if(!read('rw-judgment')){feedback('请先填写自己的判断依据。');return;}state.judgment=read('rw-judgment');state.improvement=read('rw-improvement');feedback('判断草稿已保存在本次预览中；未提交到正式系统。');const j=root.querySelector('#rw-judgment'),m=root.querySelector('#rw-improvement');if(j)j.value=state.judgment;if(m)m.value=state.improvement;}
else if(v==='action'){if(!read('rw-action-title')||!read('rw-owner')||!read('rw-applicability')||!read('rw-success')){state.notice='请补齐动作、处理人、适用条件和验证标准。';const n=document.createElement('p');n.setAttribute('role','alert');n.textContent=state.notice;el.after(n);return;}feedback('改进草稿已记录在本次预览中。正式系统将关联原事件并跟踪验证。');}
else if(v==='reconcile'){if(!read('rw-reconcile')){const n=document.createElement('p');n.setAttribute('role','alert');n.textContent='请填写核对说明。';el.after(n);return;}feedback('核对说明已记录在本次预览中；120 元差异仍待凭证核实。');}}
else if(a==='submit'){saveTemplate();if(!state.reason||!state.conclusion||!state.measure){state.notice='请填写判断依据、复盘结论和改进措施后再提交。';render();return;}state.submitted=true;feedback('演示提交完成，原内容只读；需要修改时追加更正。');}
else if(a==='correct'){state.submitted=false;feedback('正在追加更正草稿。正式系统保留已提交原文与每次更正。');}
else if(a==='implemented'){state.actionStage=1;feedback('已记录落实，进入验证阶段。未将其标记为已验证。');}
else if(a==='stress'){const p=Number(read('rw-stress')),q=Number(read('rw-volume'));const out=root.querySelector('#rw-stress-result');out.textContent=read('rw-stress')!==''&&read('rw-volume')!==''&&Number.isFinite(p)&&Number.isFinite(q)&&q>=0&&q<=100&&p>=-1000&&p<=10000?`情景偏差电费：${money(p*q)} 元；相对日前价 300 元 / 兆瓦时的额外成本：${money(q*(p-300))} 元。`:'请填写价格 −1,000 至 10,000、偏差量 0 至 100 的演示范围。';}
else if(a==='simulate'){const q=Number(read('rw-alt'));root.querySelector('#rw-alt-result').textContent=read('rw-alt')!==''&&Number.isFinite(q)&&q>=0&&q<=10?`情景购电成本 ${money(q*300+(10-q)*800)} 元；相对实际方案增益 ${money(4000-(q*300+(10-q)*800))} 元。`:'请输入 0 至 10 兆瓦时的演示采购量。';}
else if(a==='export'){const lines=v==='intervals'?[['起始时刻','实际用电量（兆瓦时）','日前出清量（兆瓦时）','实时电价（元/兆瓦时）','购电成本（元）','相对基准增益（元）','资料性质'],...rows.map(r=>[r.time,r.actual,r.cleared,r.rt,cost(r),value(r),'模拟数据'])]:[['费用项目','账单金额（元）','测算金额（元）','差异（元）','资料性质'],['现货电费',500000,500000,0,'模拟数据'],['月度考核',10000,10000,0,'模拟数据'],['月度分摊',2120,2000,120,'模拟数据']];const blob=new Blob(['\uFEFF'+lines.map(r=>r.join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='交易复盘-'+(v==='intervals'?'时段明细':'结算核对')+'-模拟数据.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);feedback('已导出模拟数据，表头使用业务名称并包含单位。');}
else if(a==='retry'){state.mode='正常';feedback('已恢复显示内置演示资料。');}
else if(a==='recompute'){state.mode='正常';state.page='overview';feedback('已演示整页统一切换；正式系统将保留新旧两次计算供比较。');}
else if(a==='sample-date'){state.date='2026-09-07';render();}
else if(a==='daily'){state.period='日度';render();}
else if(a==='subject-templates'){state.page='archive';state.archive='报告与模板';state.group=v;render();}
else if(a==='data-todo'){feedback('资料补齐待办已演示登记；处理岗位为对应资料管理员，未向他人发送消息。');}
else if(a==='import-confirm'){state.detail=null;feedback('示例账单导入完成，仍有 120 元差异待核对。');}
else if(['meeting','counterfactual','report','case','import','import-preview'].includes(a)){openDetail(a);}
});
render();
new ResizeObserver(drawPrices).observe(root);
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{state.detail=null;render();}});tweak.addSelect(state,'mode',{label:'资料状态',options:['正常','无数据','读取失败','无权限','资料更新']});tweak.addSelect(state,'appearance',{label:'页面外观',options:['跟随系统','浅色','深色']});tweak.addSelect(state,'density',{label:'阅读密度',options:['标准','紧凑']});}
})();
</script>
