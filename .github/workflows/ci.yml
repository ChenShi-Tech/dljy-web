name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    # 自托管 runner（ChenShi-Tech/dljy#3266，同 dljy-admin 的 #3259）：GitHub 托管 runner 因组织账单受限无法启动，
    # 改用主仓在用的南洋 runner。组织级 vars.CI_RUNNER 的值是离线的 dljy-mac，这里直接写标签，不复用该变量。
    runs-on: [self-hosted, dljy-linux]
    timeout-minutes: 60
    steps:
      # 不用 actions/setup-node（先于取源码：取源码的增量逻辑要用 node，而本步不依赖源码；自托管机上预下载慢且易超时，主仓同一做法）：探测 runner 预装的 node 22，
      # 缺失回退下载到 ~/.local/node-22。版本下界与 package.json engines（>=22.12）一致。
      - name: Setup Node.js
        run: |
          need_major=22
          need_minor=12
          satisfies() {
            [ -x "$1/node" ] || return 1
            v=$("$1/node" -v 2>/dev/null | sed 's/^v//')
            [ -n "$v" ] || return 1
            major=${v%%.*}; rest=${v#*.}; minor=${rest%%.*}
            [ "$major" -gt "$need_major" ] && return 0
            [ "$major" -eq "$need_major" ] && [ "$minor" -ge "$need_minor" ]
          }
          for p in /opt/node-22/bin "$HOME/.local/node-22/bin"; do
            if satisfies "$p"; then
              echo "$p" >> "$GITHUB_PATH"
              echo "using preinstalled node: $p/node ($("$p/node" -v))"
              exit 0
            fi
          done
          echo "no satisfying node found (need >=${need_major}.${need_minor}), installing to ~/.local/node-22"
          V=v22.23.2
          rm -rf "$HOME/.local/node-22" && mkdir -p "$HOME/.local/node-22"
          curl -fsSL --max-time 300 "https://nodejs.org/dist/$V/node-$V-linux-x64.tar.xz" -o /tmp/node-$V.tar.xz \
            || curl -fsSL --max-time 300 "https://cdn.npmmirror.com/binaries/node/$V/node-$V-linux-x64.tar.xz" -o /tmp/node-$V.tar.xz
          tar -xJf /tmp/node-$V.tar.xz -C "$HOME/.local/node-22" --strip-components=1
          rm -f /tmp/node-$V.tar.xz
          echo "$HOME/.local/node-22/bin" >> "$GITHUB_PATH"

      # 取源码（ChenShi-Tech/dljy#3266）：南洋 runner 上 github.com 的 https 被阻断、git 只能走 SSH 而 SSH 密钥只对主仓有权限；
      # api.github.com / codeload 能直连但只有约 35 KB/s，整包 37 MB 要十几分钟。所以在 runner 本机缓存一份 main 的源码
      # （~/.cache/ci-src/<仓>，记录其提交号），每次经 API compare 只拉「缓存提交 → 本次提交」之间的改动文件。
      # 只有缓存提交是本次提交的祖先（compare 状态 ahead/identical）且改动 < 300 个文件时才走增量，其余一律整包下载，
      # 绝不在分叉的基准上打补丁。只有 main 的 push 运行才回写缓存（PR 的合并提交不作基准）。同机两个 runner 用 flock 串行。
      # 工作区里没有 .git。
      - name: Fetch source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          CACHE="$HOME/.cache/ci-src/$REPO"
          mkdir -p "$(dirname "$CACHE")"
          exec 9>"$CACHE.lock"; flock 9
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          mode=full
          if [ -f "$CACHE/.ci-commit" ]; then
            cp -a "$CACHE/." . && rm -f .ci-commit
            if node --input-type=module -e '
              import { mkdirSync, readFileSync, rmSync, writeFileSync } from "node:fs";
              import { dirname } from "node:path";
              const { REPO, SHA, GH_TOKEN } = process.env;
              const base = readFileSync(process.env.HOME + "/.cache/ci-src/" + REPO + "/.ci-commit", "utf8").trim();
              const headers = { Authorization: `Bearer ${GH_TOKEN}` };
              const res = await fetch(`https://api.github.com/repos/${REPO}/compare/${base}...${SHA}`, { headers: { ...headers, Accept: "application/vnd.github+json" } });
              if (!res.ok) { console.log(`compare 失败 HTTP ${res.status}，改整包下载`); process.exit(3); }
              const cmp = await res.json();
              const files = cmp.files ?? [];
              if (!["ahead", "identical"].includes(cmp.status) || files.length >= 300) {
                console.log(`缓存基准 ${base.slice(0, 7)} 不可用（状态 ${cmp.status}，改动 ${files.length} 个文件），改整包下载`); process.exit(3);
              }
              const inside = (p) => { if (p.startsWith("/") || p.split("/").includes("..")) throw new Error(`非法路径 ${p}`); return p; };
              const fetchOne = async (f) => {
                const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${f.filename.split("/").map(encodeURIComponent).join("/")}?ref=${SHA}`, { headers: { ...headers, Accept: "application/vnd.github.raw" } });
                if (!r.ok) throw new Error(`读取 ${f.filename} 失败 HTTP ${r.status}`);
                mkdirSync(dirname(inside(f.filename)), { recursive: true });
                writeFileSync(f.filename, Buffer.from(await r.arrayBuffer()));
              };
              for (const f of files) {
                if (f.previous_filename) rmSync(inside(f.previous_filename), { force: true });
                if (f.status === "removed") rmSync(inside(f.filename), { force: true });
              }
              const todo = files.filter((f) => f.status !== "removed");
              for (let i = 0; i < todo.length; i += 6) await Promise.all(todo.slice(i, i + 6).map(fetchOne));
              console.log(`增量取源码：基准 ${base.slice(0, 7)} → ${SHA.slice(0, 7)}，拉取 ${todo.length} 个文件，删除 ${files.length - todo.length} 个`);
            '; then mode=incremental; else find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +; fi
          fi
          if [ "$mode" = full ]; then
            out="$RUNNER_TEMP/src.tar.gz"; rm -f "$out"
            for i in 1 2 3; do
              curl -fsSL -C - --max-time 2400 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                -o "$out" "https://api.github.com/repos/$REPO/tarball/$SHA" && break
              [ "$i" = 3 ] && { echo "::error::整包下载失败"; exit 1; }
            done
            tar -xzf "$out" --strip-components=1 && rm -f "$out"
            echo "整包取源码：$SHA"
          fi
          test -f package.json
          if [ "$IS_MAIN_PUSH" = true ]; then
            rm -rf "$CACHE.tmp" && mkdir -p "$CACHE.tmp" && cp -a . "$CACHE.tmp/" && echo "$SHA" > "$CACHE.tmp/.ci-commit"
            rm -rf "$CACHE" && mv "$CACHE.tmp" "$CACHE" && echo "已回写源码缓存：$SHA"
          fi

      - run: npm ci

      # 镜像守卫：vendor/ 与 shared/schema/generated/ 是上游生成物快照（只读），
      # 协作者 PR 改它们会在下一次同步被覆盖——直接拒绝，避免无效工作。
      # 工作区没有 .git：改动文件列表经 API 取（含改名前的旧路径）；读取失败判红，不当作「没有改动」放行。
      - name: Mirror guard
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_FILES_URL: https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        run: |
          node --input-type=module -e '
            const url = process.env.PR_FILES_URL;
            const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json" };
            const files = [];
            for (let page = 1; ; page += 1) {
              const res = await fetch(`${url}?per_page=100&page=${page}`, { headers });
              if (!res.ok) { console.error(`::error::读取 PR 改动文件失败（HTTP ${res.status}）`); process.exit(1); }
              const batch = await res.json();
              for (const f of batch) { files.push(f.filename); if (f.previous_filename) files.push(f.previous_filename); }
              if (batch.length < 100) break;
            }
            const guarded = [...new Set(files)].filter((p) => p.startsWith("vendor/") || p.startsWith("shared/schema/generated/"));
            if (guarded.length) {
              console.error("::error::以下文件是上游生成物镜像（只读），请勿在本仓修改：");
              for (const p of guarded) console.error(p);
              process.exit(1);
            }
            console.log(`镜像守卫通过：本 PR 改动 ${files.length} 个路径，未触及只读镜像目录`);
          '

      # lint 只拦 error（分层守卫 + correctness）；291 处 no-explicit-any 为 warn，
      # 列技术债渐进清零（见 DEVELOPMENT.md 已知技术债）。
      - run: npm run lint

      # vue-tsc 的峰值内存已贴着 runner 默认堆上限，曾稳定 exit 134（ChenShi-Tech/dljy#2985）：显式给够堆，别靠默认值碰运气。
      - run: npm run check
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # test:coverage 跑同一套 spec 并附带覆盖率阈值门禁（见 vitest.config.ts），
      # 不再单独跑 test:unit（纯重复）。
      # 南洋 runner 有 160 核，vitest 默认按核数起 worker（约 160 个），导入/编译互相抢占，用例成片超时（#3266 首跑实测）；
      # 托管 runner 只有 4 核所以从未暴露。封顶 8 个 worker：与本机开发机同量级，不改用例超时阈值。
      - run: npm run test:coverage -- --maxWorkers=8

      - run: npm run build

      # 客户交付版门禁（yunnan-launch-readiness W3-T7）：自建 customer 产物
      # （dist-customer-verify）后扫描——品牌词/已迁入口/后台地址零泄露 + shared 指纹同代。
      # Linux runner 无 Windows 的 spawnSync npx 问题，脚本自建路径可用。
      - run: npm run verify:customer-edition-build
